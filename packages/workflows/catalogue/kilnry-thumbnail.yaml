id: kilnry-thumbnail
name: Thumbnail
summary: "A high-contrast video thumbnail from a topic, with three framings to pick from and a burned title."
version: 1.0.0
description: >
  A high-contrast video thumbnail from a topic and optional face references: three framings to pick from, a cast pass that
  places the subject with the chosen emotion, a scene compose that leaves room for the headline, and a burned title.
category: image
requires: [image_edit, vlm]
inputs:
  type: object
  required: [topic]
  properties:
    topic: { type: string, x-kilnry: { widget: text } }
    reference_thumbnail:
      {
        type: string,
        default: '',
        description: 'A thumbnail to echo the style of',
        x-kilnry: { widget: media, accept: [image], roles: [reference], allow_url: true, allow_empty: true },
      }
    logo:
      {
        type: string,
        default: '',
        description: 'A logo to place, optionally in 3D',
        x-kilnry: { widget: media, accept: [image], roles: [reference], allow_empty: true },
      }
    face_refs:
      {
        type: array,
        items: { type: string },
        default: [],
        maxItems: 3,
        x-kilnry: { widget: media, accept: [image], roles: [reference] },
      }
    headline: { type: string, maxLength: 48, x-kilnry: { widget: text, help: 'At most six words' } }
    aspect: { type: string, enum: ['16:9', '9:16', '1:1'], default: '16:9', x-kilnry: { widget: segment } }
    style_key:
      {
        type: string,
        default: '',
        description: 'A named look to hold across takes',
        x-kilnry: { widget: text, help: 'e.g. neon-noir, bright-vlog' },
      }
    emotion:
      {
        type: array,
        items:
          {
            type: string,
            enum:
              [
                surprised,
                serious,
                delighted,
                curious,
                alarmed,
                thrilled,
                skeptical,
                shocked,
                proud,
                worried,
                amused,
              ],
          },
        default: [surprised],
        maxItems: 3,
        x-kilnry: { widget: tags, help: 'One or more expressions to try' },
      }
    logo_3d:
      { type: boolean, default: false, x-kilnry: { widget: toggle, label: 'Render the logo in 3D' } }
    takes:
      { type: integer, minimum: 1, maximum: 4, default: 2, x-kilnry: { widget: chips, options: [1, 2, 4] } }
    palette: { type: array, items: { type: string }, default: [], x-kilnry: { widget: tags } }
budget: { max_usd: 1.5, warn_usd: 0.9 }
steps:
  - id: concept
    kind: analyze
    name: Three framings
    task: describe
    model: auto
    instructions: >
      Propose three thumbnail framings for a video about: {{ inputs.topic }}. Each is one sentence naming the subject placement,
      the focal element and where the title sits. Return JSON {framings: string[3]}.
    schema:
      {
        type: object,
        required: [framings],
        properties: { framings: { type: array, items: { type: string } } },
      }
    outputs: { framings: '{{ result.structured.framings }}' }

  - id: pick
    name: "Pick a framing"
    kind: approval
    mode: soft
    title: 'Pick a framing'
    message: "{{ steps.concept.outputs.framings | join(' · ') }}"

  - id: cast
    kind: generate
    when: '{{ len(inputs.face_refs) > 0 }}'
    name: Cast the subject
    capability: image_edit
    model: auto
    constraints: { quality: standard, refs_count: '{{ len(inputs.face_refs) }}' }
    alternates: [fal-ai/nano-banana-pro/edit, fal-ai/bytedance/seedream/v4.5/edit]
    prompt: >
      The person in image 1, {{ inputs.emotion | first }}, half-body, looking straight at the lens, dramatic key light.
      Keep the face identity exact. Plain background for now. No text.
    params: { aspect_ratio: '{{ inputs.aspect }}', resolution: '2K' }
    medias: "{{ inputs.face_refs | map_role('reference') }}"
    outputs: { asset: '{{ result.assets[0] }}' }

  - id: logo_3d
    kind: generate
    when: "{{ inputs.logo != '' && inputs.logo_3d }}"
    name: 3D logo
    capability: image_edit
    model: auto
    prompt: >
      Render the logo in image 1 as a glossy three-dimensional object with soft studio reflections on a transparent
      background. Keep the mark and its colours exact. No text.
    params: { aspect_ratio: '1:1', resolution: '1K' }
    medias: [{ role: reference, ref: '{{ inputs.logo }}' }]
    on_fail: continue
    outputs: { asset: '{{ result.assets[0] }}' }

  - id: scene
    kind: generate
    name: Compose the scene
    capability: image_edit
    model: auto
    constraints:
      {
        quality: premium,
        refs_count: '{{ (len(inputs.face_refs) > 0 ? 1 : 0) + (inputs.reference_thumbnail != "" ? 1 : 0) }}',
      }
    alternates: [openai/gpt-image-2.5-sunburst, fal-ai/nano-banana-pro/edit]
    prompt: >
      A {{ inputs.aspect }} video thumbnail about {{ inputs.topic }}: high contrast, one clear focal element, bold rim light,
      readable at 200 px wide. {{ len(inputs.face_refs) > 0 ? 'Use the subject from image 1.' : '' }}
      {{ inputs.reference_thumbnail != '' ? 'Echo the composition and mood of the reference thumbnail.' : '' }}
      {{ inputs.style_key != '' ? 'Hold this named look across takes: ' + inputs.style_key + '.' : '' }}
      Leave the {{ inputs.aspect == '16:9' ? 'left third' : 'top third' }} clear for a title.
      {{ len(inputs.palette) > 0 ? 'Palette: ' + (inputs.palette | join(', ')) + '.' : '' }} No text yet.
    params: { aspect_ratio: '{{ inputs.aspect }}', resolution: '2K', quality: high }
    medias:
      - { role: reference, ref: '{{ steps.cast.outputs.asset }}', when: '{{ steps.cast.outputs.asset }}' }
      - {
          role: reference,
          ref: '{{ inputs.reference_thumbnail }}',
          when: "{{ inputs.reference_thumbnail != '' }}",
          label: reference_thumbnail,
        }
    count: '{{ inputs.takes }}'
    outputs: { assets: '{{ result.assets }}' }

  - id: check_k
    kind: analyze
    name: Check the takes
    task: consistency_check
    model: auto
    refs: '{{ steps.scene.outputs.assets }}'
    instructions: >
      For each take, is the focal element clear at 200 px, the title area clear, and the look consistent with the
      others? Return JSON {pass, reasons, weakest_index}.
    on_fail: continue
    outputs: { pass: '{{ result.structured.pass }}', weakest: '{{ result.structured.weakest_index }}' }

  - id: tweak
    kind: generate
    when: '{{ steps.check_k.outputs.pass == false }}'
    name: Tweak the weakest take
    capability: image_edit
    model: auto
    prompt: >
      Improve contrast and focal clarity on this thumbnail take while keeping its composition and the clear title area.
      No text.
    params: { aspect_ratio: '{{ inputs.aspect }}', resolution: '2K' }
    medias: [{ role: reference, ref: '{{ steps.scene.outputs.assets | first }}' }]
    on_fail: continue
    outputs: { asset: '{{ result.assets[0] }}' }

  - id: text
    name: "Add the title"
    kind: assemble
    when: '{{ inputs.headline }}'
    op: overlay_text
    inputs: ['{{ steps.tweak.outputs.asset | default(steps.scene.outputs.assets | first) }}']
    params:
      {
        text: '{{ inputs.headline }}',
        font: 'Montserrat 800',
        stroke: true,
        position: "{{ inputs.aspect == '16:9' ? 'left' : 'top' }}",
        safe_zone: reels,
      }
    output_name: thumbnail.png
    outputs: { asset: '{{ result.asset_id }}' }

  - id: export
    name: "Save the thumbnail"
    kind: export
    files:
      - {
          ref: '{{ steps.text.outputs.asset | default(steps.scene.outputs.assets | first) }}',
          name: thumbnail.png,
          tags: [deliverable],
        }
      - { ref: '{{ steps.scene.outputs.assets }}', name: 'take_{{ index + 1 | pad(2) }}.png', tags: [take] }
outputs:
  final: '{{ steps.text.outputs.asset | default(steps.scene.outputs.assets | first) }}'
