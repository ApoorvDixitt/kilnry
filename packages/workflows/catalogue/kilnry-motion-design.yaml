id: kilnry-motion-design
name: Explainer and motion design
version: 1.0.0
description: >
  A short explainer in a chosen motion-design style: a scripted set of scenes, a locked style key, a moving clip per scene,
  narration over the top, an end card with the logo, and burned subtitles.
category: video
requires: [text2image, text2video, tts, stt]
inputs:
  type: object
  required: [brief, voice]
  properties:
    brief: { type: string, x-kilnry: { widget: textarea } }
    style:
      {
        type: string,
        enum: [saas_motion, apple_clean, paper_collage, vector_2d, claymation, blueprint],
        default: saas_motion,
        x-kilnry: { widget: select },
      }
    duration_s:
      {
        type: integer,
        minimum: 15,
        maximum: 60,
        default: 30,
        x-kilnry: { widget: chips, options: [15, 30, 45, 60], unit: s },
      }
    aspect: { type: string, enum: ['16:9', '9:16', '1:1'], default: '16:9', x-kilnry: { widget: segment } }
    voice: { type: string, x-kilnry: { widget: voice } }
    brand_colors: { type: array, items: { type: string }, default: [], x-kilnry: { widget: tags } }
    logo:
      {
        type: string,
        description: 'Logo image for the end card',
        x-kilnry: { widget: media, accept: [image], roles: [reference], allow_empty: true },
      }
    language: { type: string, default: en, x-kilnry: { widget: language } }
defaults:
  style_prompts:
    saas_motion: 'clean SaaS motion-graphics, flat shapes, soft gradients, generous whitespace'
    apple_clean: 'minimal product-launch look, dark background, crisp typography space, subtle depth'
    paper_collage: 'paper-collage textures, torn edges, warm palette, tactile'
    vector_2d: 'bold flat 2D vector illustration, limited palette, thick outlines'
    claymation: 'soft clay-render look, rounded forms, gentle studio light'
    blueprint: 'technical blueprint aesthetic, thin lines on deep blue, annotations'
budget: { max_usd: 6, warn_usd: 3 }
steps:
  - id: plan
    kind: set
    values:
      n_scenes: '{{ max(2, round(inputs.duration_s / 8)) }}'
      style_prompt: '{{ defaults.style_prompts[inputs.style] }}'

  - id: script
    kind: analyze
    name: Write the scenes
    task: describe
    model: auto
    instructions: >
      Write {{ vars.n_scenes }} scenes for a {{ inputs.duration_s }} s explainer in {{ inputs.language }} about: {{ inputs.brief }}.
      Each scene has one spoken line (<= 18 words) and one visual direction in the {{ inputs.style }} style.
      Return JSON {scenes: [{line, visual}]}.
    schema: { type: object, required: [scenes], properties: { scenes: { type: array } } }
    outputs: { scenes: '{{ result.structured.scenes }}' }

  - id: style_key
    kind: generate
    name: Style key
    capability: text2image
    model: auto
    constraints: { quality: standard }
    alternates: [fal-ai/bytedance/seedream/v4.5/text-to-image, fal-ai/flux-2-pro]
    prompt: >
      Style sample only: a wide establishing frame in this exact look — {{ vars.style_prompt }}.
      {{ len(inputs.brand_colors) > 0 ? 'Palette: ' + (inputs.brand_colors | join(', ')) + '.' : '' }} No text, no logos.
    params: { aspect_ratio: '{{ inputs.aspect }}', resolution: '1K' }
    approval: soft
    outputs: { asset: '{{ result.assets[0] }}' }

  - id: scenes
    kind: foreach
    over: '{{ steps.script.outputs.scenes }}'
    as: scene
    expect: '{{ vars.n_scenes }}'
    concurrency: 3
    steps:
      - id: scene_gen
        kind: generate
        name: 'Scene {{ index + 1 }}'
        capability: text2video
        model: auto
        constraints: { needs_audio: false, duration_s: 8, tags: [motion_design] }
        alternates: [minimax/h3/text-to-video, bytedance/seedance-2.0/text-to-video]
        prompt: >
          In exactly the style of image 1, {{ vars.style_prompt }}: {{ scene.visual }}. Smooth motion-graphics animation, 5–8 s, no text on screen.
        params: { aspect_ratio: '{{ inputs.aspect }}', resolution: '1080p', duration_s: 8, audio: false }
        medias: [{ role: style, ref: '{{ steps.style_key.outputs.asset }}' }]
        retry: { max: 1, on: [MODERATION_REJECTED, PROVIDER_ERROR, TIMEOUT], reword: true }
        outputs: { asset: '{{ result.assets[0] }}' }
      - id: scene_vo
        kind: generate
        name: 'Voice {{ index + 1 }}'
        capability: tts
        model: auto
        prompt: '{{ scene.line }}'
        params: { voice: '{{ inputs.voice }}', language: '{{ inputs.language }}', format: wav }
        outputs: { asset: '{{ result.assets[0] }}' }
      - id: scene_mux
        kind: assemble
        op: mux_audio
        inputs: ['{{ steps.scene_gen.outputs.asset }}', '{{ steps.scene_vo.outputs.asset }}']
        params: { mode: replace, fit: video }
        output_name: 'scene_{{ index + 1 | pad(2) }}.mp4'
        outputs: { asset: '{{ result.asset_id }}' }

  - id: concat
    kind: assemble
    name: Assemble
    op: concat
    inputs: "{{ steps.scenes.outputs | map('asset') }}"
    params: { mode: auto, target: { resolution: 1080p, aspect: '{{ inputs.aspect }}' }, transition: none }
    output_name: cut.mp4
    outputs: { asset: '{{ result.asset_id }}' }

  - id: end_card
    kind: assemble
    when: '{{ inputs.logo }}'
    op: overlay_image
    inputs: ['{{ steps.concat.outputs.asset }}', '{{ inputs.logo }}']
    params:
      {
        position: center,
        width_pct: 30,
        start: '{{ inputs.duration_s - 3 }}',
        end: '{{ inputs.duration_s }}',
      }
    output_name: cut_logo.mp4
    outputs: { asset: '{{ result.asset_id }}' }

  - id: master
    kind: set
    values: { asset: '{{ steps.end_card.outputs.asset | default(steps.concat.outputs.asset) }}' }

  - id: transcribe
    kind: transform
    op: transcribe
    source: '{{ vars.asset }}'
    params: { language: '{{ inputs.language }}' }
    outputs: { transcript: '{{ result.assets[0] }}' }
  - id: burn
    kind: assemble
    op: burn_captions
    inputs: ['{{ vars.asset }}']
    params:
      {
        transcript: '{{ steps.transcribe.outputs.transcript }}',
        look: clean,
        max_words: 5,
        max_chars: 32,
        safe_zone: "{{ inputs.aspect == '9:16' ? 'reels' : 'landscape' }}",
        language: '{{ inputs.language | slice(0, 2) }}',
      }
    output_name: final.mp4
    outputs: { asset: '{{ result.asset_id }}' }

  - id: export
    kind: export
    files:
      - { ref: '{{ steps.burn.outputs.asset }}', name: final.mp4, tags: [deliverable] }
      - { ref: '{{ steps.style_key.outputs.asset }}', name: style_key.png, tags: [style] }
outputs:
  final: '{{ steps.burn.outputs.asset }}'
