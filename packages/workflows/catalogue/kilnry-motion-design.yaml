id: kilnry-motion-design
name: Explainer and motion design
summary: "A short explainer in a motion-design style: scripted scenes, narration, an end card with your logo, and subtitles."
version: 1.0.0
description: >
  A short explainer in a chosen motion-design style: a scripted set of scenes, a locked style key, a moving clip per scene,
  narration over the top, an end card with the logo, and burned subtitles.
category: video
requires: [text2image, text2video, tts, stt]
inputs:
  type: object
  required: [brief, voice]
  properties:
    brief: { type: string, x-kilnry: { widget: textarea } }
    style:
      {
        type: string,
        enum:
          [
            saas_motion,
            apple_clean,
            paper_collage,
            vector_2d,
            claymation,
            blueprint,
            neon_grid,
            hand_drawn,
            isometric_3d,
            kinetic_type,
            liquid_gradient,
          ],
        default: saas_motion,
        x-kilnry: { widget: select },
      }
    duration_s:
      {
        type: integer,
        minimum: 15,
        maximum: 60,
        default: 30,
        x-kilnry: { widget: chips, options: [15, 30, 45, 60], unit: s },
      }
    aspect: { type: string, enum: ['16:9', '9:16', '1:1'], default: '16:9', x-kilnry: { widget: segment } }
    voice: { type: string, x-kilnry: { widget: voice } }
    brand_colors: { type: array, items: { type: string }, default: [], x-kilnry: { widget: tags } }
    logo:
      {
        type: string,
        description: 'Logo image for the end card',
        x-kilnry: { widget: media, accept: [image], roles: [reference], allow_empty: true },
      }
    music:
      {
        type: boolean,
        default: true,
        x-kilnry: { widget: toggle, label: 'Add a background music bed' },
      }
    titles:
      {
        type: boolean,
        default: true,
        x-kilnry: { widget: toggle, label: 'Burn scene titles' },
      }
    language: { type: string, default: en, x-kilnry: { widget: language } }
defaults:
  style_prompts:
    saas_motion: 'clean SaaS motion-graphics, flat shapes, soft gradients, generous whitespace'
    apple_clean: 'minimal product-launch look, dark background, crisp typography space, subtle depth'
    paper_collage: 'paper-collage textures, torn edges, warm palette, tactile'
    vector_2d: 'bold flat 2D vector illustration, limited palette, thick outlines'
    claymation: 'soft clay-render look, rounded forms, gentle studio light'
    blueprint: 'technical blueprint aesthetic, thin lines on deep blue, annotations'
    neon_grid: 'retro neon grid, glowing lines on dark, synthwave palette'
    hand_drawn: 'hand-drawn frame-by-frame look, ink lines, paper grain'
    isometric_3d: 'isometric 3D scene, soft ambient occlusion, pastel blocks'
    kinetic_type: 'kinetic typography, bold moving words, high-contrast layout'
    liquid_gradient: 'liquid gradient meshes, smooth colour flow, glassy highlights'
  # Kilnry's H3 prompt system builds each scene as a ten-second MiniMax H3 block:
  # Hook (0–3 s), Heart (3–7 s), Hand-off (7–10 s), so scenes cut on beats.
  block_s: 10
budget: { max_usd: 6, warn_usd: 3 }
steps:
  - id: plan
    name: "Plan the scenes"
    kind: set
    values:
      n_scenes: '{{ max(2, round(inputs.duration_s / defaults.block_s)) }}'
      style_prompt: '{{ defaults.style_prompts[inputs.style] }}'

  - id: script
    kind: analyze
    name: Write the scenes
    task: describe
    model: auto
    instructions: >
      Write {{ vars.n_scenes }} scenes for a {{ inputs.duration_s }} s explainer in {{ inputs.language }} about: {{ inputs.brief }}.
      Each scene is a ten-second MiniMax H3 block: a Hook (0–3 s), a Heart (3–7 s) and a Hand-off (7–10 s).
      Give each scene one spoken line (<= 22 words) and one visual direction in the {{ inputs.style }} style.
      Return JSON {scenes: [{line, visual}]}.
    schema: { type: object, required: [scenes], properties: { scenes: { type: array } } }
    outputs: { scenes: '{{ result.structured.scenes }}' }

  - id: approve_plan
    name: "Approve the plan"
    kind: approval
    mode: soft
    title: 'Approve the scene plan'
    message: "{{ vars.n_scenes }} scenes in {{ inputs.style }}. Deny to stop before any clip is rendered."

  - id: style_key
    kind: generate
    name: Style key
    capability: text2image
    model: auto
    constraints: { quality: standard }
    alternates: [fal-ai/bytedance/seedream/v4.5/text-to-image, fal-ai/flux-2-pro]
    prompt: >
      Style sample only: a wide establishing frame in this exact look — {{ vars.style_prompt }}.
      {{ len(inputs.brand_colors) > 0 ? 'Palette: ' + (inputs.brand_colors | join(', ')) + '.' : '' }} No text, no logos.
    params: { aspect_ratio: '{{ inputs.aspect }}', resolution: '1K' }
    approval: soft
    outputs: { asset: '{{ result.assets[0] }}' }

  - id: scenes
    name: "Make each scene"
    kind: foreach
    over: '{{ steps.script.outputs.scenes }}'
    as: scene
    expect: '{{ vars.n_scenes }}'
    concurrency: 3
    steps:
      - id: scene_gen
        kind: generate
        name: 'Scene {{ index + 1 }}'
        capability: text2video
        model: auto
        constraints: { needs_audio: false, duration_s: 10, tags: [motion_design] }
        alternates: [minimax/h3/text-to-video, bytedance/seedance-2.0/text-to-video]
        prompt: >
          In exactly the style of image 1, {{ vars.style_prompt }}: {{ scene.visual }}.
          Ten-second MiniMax H3 block — Hook, Heart, Hand-off — smooth motion-graphics animation, no text on screen.
        params: { aspect_ratio: '{{ inputs.aspect }}', resolution: '1080p', duration_s: 10, audio: false }
        medias: [{ role: style, ref: '{{ steps.style_key.outputs.asset }}' }]
        retry: { max: 1, on: [MODERATION_REJECTED, PROVIDER_ERROR, TIMEOUT], reword: true }
        outputs: { asset: '{{ result.assets[0] }}' }
      - id: scene_vo
        kind: generate
        name: 'Voice {{ index + 1 }}'
        capability: tts
        model: auto
        prompt: '{{ scene.line }}'
        params: { voice: '{{ inputs.voice }}', language: '{{ inputs.language }}', format: wav }
        outputs: { asset: '{{ result.assets[0] }}' }
      - id: scene_mux
        name: "Add the narration"
        kind: assemble
        op: mux_audio
        inputs: ['{{ steps.scene_gen.outputs.asset }}', '{{ steps.scene_vo.outputs.asset }}']
        params: { mode: replace, fit: video }
        output_name: 'scene_{{ index + 1 | pad(2) }}.mp4'
        outputs: { asset: '{{ result.asset_id }}' }

  - id: motion_check_k
    kind: analyze
    name: Check the scenes
    task: consistency_check
    model: auto
    refs: "{{ steps.scenes.outputs | map('asset') }}"
    instructions: >
      Do the scenes hold one consistent motion-design look and cut on the H3 beats, with no on-screen text and no
      style drift between them? Return JSON {pass, reasons, weakest_index}.
    on_fail: continue
    outputs: { pass: '{{ result.structured.pass }}' }

  - id: concat
    kind: assemble
    name: Assemble
    op: concat
    inputs: "{{ steps.scenes.outputs | map('asset') }}"
    params: { mode: auto, target: { resolution: 1080p, aspect: '{{ inputs.aspect }}' }, transition: none }
    output_name: cut.mp4
    outputs: { asset: '{{ result.asset_id }}' }

  - id: music
    name: "Music"
    kind: branch
    when: '{{ inputs.music }}'
    then:
      - id: music_gen
        kind: generate
        name: Music bed
        capability: tts
        model: auto
        prompt: 'A subtle instrumental background bed matching a {{ inputs.style }} explainer, {{ inputs.duration_s }} s, no vocals.'
        params: { language: '{{ inputs.language }}', format: wav, kind: music }
        on_fail: continue
        outputs: { asset: '{{ result.assets[0] }}' }
      - id: music_mix
        name: "Mix in the music"
        kind: assemble
        op: mux_audio
        inputs: ['{{ steps.concat.outputs.asset }}', '{{ steps.music_gen.outputs.asset }}']
        params: { mode: under, gain_db: -18, fit: video }
        output_name: cut_music.mp4
        on_fail: continue
        outputs: { asset: '{{ result.asset_id }}' }
    else: []

  - id: with_music
    name: "Use the mix"
    kind: set
    values: { music_asset: '{{ steps.music_mix.outputs.asset | default(steps.concat.outputs.asset) }}' }

  - id: end_card
    name: "Add the end card"
    kind: assemble
    when: '{{ inputs.logo }}'
    op: overlay_image
    inputs: ['{{ vars.music_asset }}', '{{ inputs.logo }}']
    params:
      {
        position: center,
        width_pct: 30,
        start: '{{ inputs.duration_s - 3 }}',
        end: '{{ inputs.duration_s }}',
      }
    output_name: cut_logo.mp4
    outputs: { asset: '{{ result.asset_id }}' }

  - id: master
    name: "Master"
    kind: set
    values: { master: '{{ steps.end_card.outputs.asset | default(vars.music_asset) }}' }

  - id: transcribe
    name: "Transcribe the narration"
    kind: transform
    when: '{{ inputs.titles }}'
    op: transcribe
    source: '{{ vars.master }}'
    params: { language: '{{ inputs.language }}' }
    outputs: { transcript: '{{ result.assets[0] }}' }
  - id: burn
    name: "Burn the subtitles"
    kind: assemble
    when: '{{ inputs.titles }}'
    op: burn_captions
    inputs: ['{{ vars.master }}']
    params:
      {
        transcript: '{{ steps.transcribe.outputs.transcript }}',
        look: clean,
        max_words: 5,
        max_chars: 32,
        safe_zone: "{{ inputs.aspect == '9:16' ? 'reels' : 'landscape' }}",
        language: '{{ inputs.language | slice(0, 2) }}',
      }
    output_name: final.mp4
    outputs: { asset: '{{ result.asset_id }}' }

  - id: export
    name: "Save the video"
    kind: export
    files:
      - { ref: '{{ steps.burn.outputs.asset | default(vars.master) }}', name: final.mp4, tags: [deliverable] }
      - { ref: '{{ steps.style_key.outputs.asset }}', name: style_key.png, tags: [style] }
outputs:
  final: '{{ steps.burn.outputs.asset | default(vars.master) }}'
