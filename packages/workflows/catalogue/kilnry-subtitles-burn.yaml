id: kilnry-subtitles-burn
name: Subtitles burn
summary: "Transcribe a video, edit the words, and burn readable captions into it."
version: 1.0.0
description: >
  Transcribe a video and burn readable captions into it. Review and edit the transcript before it is burned; choose the look,
  line length and position.
category: utility
requires: [stt]
inputs:
  type: object
  required: [video]
  properties:
    video:
      {
        type: string,
        description: 'The video to caption',
        x-kilnry: { widget: media, accept: [video], roles: [video] },
      }
    authored_text:
      {
        type: string,
        default: '',
        description: 'Paste the exact script to align, instead of transcribing',
        x-kilnry: { widget: textarea, help: 'Leave empty to transcribe the audio' },
      }
    stt_route:
      {
        type: string,
        enum: [auto, whisper, elevenlabs],
        default: auto,
        x-kilnry: { widget: select, help: 'Which transcription route to use' },
      }
    look: { type: string, enum: [clean, paper, bold], default: clean, x-kilnry: { widget: segment } }
    language: { type: string, default: en, x-kilnry: { widget: language } }
    max_line_chars: { type: integer, minimum: 16, maximum: 48, default: 28, x-kilnry: { widget: number } }
    position:
      { type: string, enum: [lower_third, center, top], default: lower_third, x-kilnry: { widget: select } }
    karaoke: { type: boolean, default: false, x-kilnry: { widget: toggle } }
budget: { max_usd: 1, warn_usd: 0.5 }
steps:
  - id: transcribe
    kind: transform
    name: Transcribe
    op: transcribe
    source: '{{ inputs.video }}'
    params:
      language: '{{ inputs.language }}'
      route: '{{ inputs.stt_route }}'
      align_text: '{{ inputs.authored_text }}'
    outputs: { transcript: '{{ result.assets[0] }}', words: '{{ result.result.words }}' }

  # align — when the operator pasted the exact script, fit it to the audio timing
  # from the transcription rather than trusting the recognised words (PRD-10 §9).
  - id: align
    kind: analyze
    when: "{{ inputs.authored_text != '' }}"
    name: Align the authored script
    task: describe
    model: auto
    instructions: >
      Align this authored script to the transcribed word timings so each word keeps its start and end time.
      Script: {{ inputs.authored_text }}. Return JSON {aligned: string}.
    schema: { type: object, required: [aligned], properties: { aligned: { type: string } } }
    on_fail: continue
    outputs: { aligned: '{{ result.structured.aligned }}' }

  # group — break the words into caption lines within the line-length budget.
  - id: group
    kind: analyze
    name: Group into caption lines
    task: describe
    model: auto
    instructions: >
      Group these transcript words into caption lines of at most {{ inputs.max_line_chars }} characters, breaking at
      natural phrase boundaries. Return JSON {lines: string[]}.
    on_fail: continue
    outputs: { lines: '{{ result.structured.lines }}' }

  - id: review
    name: "Edit the words"
    kind: approval
    mode: soft
    title: 'Review the transcript'
    message: 'Edit the words before they are burned in. Deny to stop.'
    show: ['{{ steps.transcribe.outputs.transcript }}']

  - id: burn
    kind: assemble
    name: Burn captions
    op: burn_captions
    inputs: ['{{ inputs.video }}']
    params:
      transcript: '{{ steps.transcribe.outputs.transcript }}'
      look: '{{ inputs.look }}'
      max_chars: '{{ inputs.max_line_chars }}'
      position: '{{ inputs.position }}'
      highlight_words: '{{ inputs.karaoke }}'
      language: '{{ inputs.language | slice(0, 2) }}'
    output_name: captioned.mp4
    outputs: { asset: '{{ result.asset_id }}' }

  # verify — confirm the burned captions are legible and in the safe zone.
  - id: verify
    kind: analyze
    name: Verify the captions
    task: consistency_check
    model: auto
    refs: ['{{ steps.burn.outputs.asset }}']
    instructions: >
      Are the burned captions legible, inside the safe zone for {{ inputs.position }}, and free of overlap with the
      speaker? Return JSON {pass, reasons}.
    on_fail: continue
    outputs: { pass: '{{ result.structured.pass }}' }

  - id: export
    name: "Save the video"
    kind: export
    files:
      - { ref: '{{ steps.burn.outputs.asset }}', name: captioned.mp4, tags: [deliverable] }
outputs:
  final: '{{ steps.burn.outputs.asset }}'
