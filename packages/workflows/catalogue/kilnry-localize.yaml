id: kilnry-localize
name: Localize
version: 1.0.0
description: >
  Dub a video into up to three languages: transcribe, translate with timing hints, review the translations, then either a
  provider dub or a per-segment voice, optional lip-sync and burned subtitles. One output per language.
category: audio
requires: [stt, tts, lipsync]
inputs:
  type: object
  required: [video, target_languages]
  properties:
    video: { type: string, x-kilnry: { widget: media, accept: [video], roles: [video] } }
    target_languages:
      {
        type: array,
        items: { type: string },
        maxItems: 3,
        default: [],
        x-kilnry: { widget: tags, help: 'Up to three language codes' },
      }
    keep_voice:
      { type: boolean, default: false, x-kilnry: { widget: toggle, label: 'Clone the original voice' } }
    keep_music:
      {
        type: boolean,
        default: true,
        x-kilnry:
          { widget: toggle, label: 'Keep the original music and background under the new voice' },
      }
    provider_dub:
      { type: boolean, default: true, x-kilnry: { widget: toggle, label: 'Use provider dubbing' } }
    lipsync: { type: boolean, default: false, x-kilnry: { widget: toggle } }
    burn_subtitles: { type: boolean, default: true, x-kilnry: { widget: toggle } }
    voice:
      {
        type: string,
        description: 'provider:voice_id when not cloning',
        x-kilnry: { widget: voice, allow_empty: true },
      }
budget: { max_usd: 6, warn_usd: 3 }
steps:
  - id: transcribe
    kind: transform
    name: Transcribe the source
    op: transcribe
    source: '{{ inputs.video }}'
    outputs: { transcript: '{{ result.assets[0] }}', text: '{{ result.result.text }}' }

  - id: translate
    kind: foreach
    over: '{{ inputs.target_languages }}'
    as: lang
    concurrency: 3
    steps:
      - id: translate_one
        kind: analyze
        name: 'Translate to {{ lang }}'
        task: describe
        model: auto
        instructions: >
          Translate this transcript to {{ lang }}, preserving sentence order and rough timing so it can be dubbed over the same cuts.
          Keep names and numbers. Return JSON {segments: string[]}.
        schema:
          {
            type: object,
            required: [segments],
            properties: { segments: { type: array, items: { type: string } } },
          }
        outputs: { segments: '{{ result.structured.segments }}', lang: '{{ lang }}' }

  - id: review
    kind: approval
    mode: soft
    title: 'Review the {{ len(inputs.target_languages) }} translation(s)'
    message: 'Approve to dub, or deny to stop.'

  - id: dubs
    kind: foreach
    over: '{{ inputs.target_languages }}'
    as: lang
    expect: '{{ len(inputs.target_languages) }}'
    concurrency: 2
    steps:
      - id: audio
        kind: branch
        when: '{{ inputs.provider_dub }}'
        then:
          - id: provider_dub
            kind: transform
            name: 'Dub · {{ lang }}'
            op: dubbing
            source: '{{ inputs.video }}'
            params: { target_language: '{{ lang }}', keep_voice: '{{ inputs.keep_voice }}' }
            outputs: { asset: '{{ result.assets[0] }}' }
        else:
          - id: tts_dub
            kind: generate
            name: 'Voice · {{ lang }}'
            capability: tts
            model: auto
            prompt: "{{ (steps.translate.outputs | filter('lang', lang) | first).segments | join(' ') }}"
            params: { voice: '{{ inputs.voice }}', language: '{{ lang }}', format: wav }
            outputs: { asset: '{{ result.assets[0] }}' }
      - id: track
        kind: set
        values: { audio: '{{ steps.provider_dub.outputs.asset | default(steps.tts_dub.outputs.asset) }}' }
      # Preserve the original music and background: pull the source bed off the
      # video, then lay the dubbed voice over it rather than replacing the whole
      # track, so a localised cut keeps its music (the W9 golden rule). Provider
      # dubbing returns a finished video, so it carries its own mixed bed and
      # skips this. With keep_music off, the new voice replaces the track.
      - id: bed
        kind: branch
        when: '{{ inputs.keep_music && !inputs.provider_dub }}'
        then:
          - id: source_bed
            kind: assemble
            name: 'Keep music · {{ lang }}'
            op: extract_audio
            inputs: ['{{ inputs.video }}']
            output_name: 'bed_{{ lang }}.wav'
            outputs: { asset: '{{ result.asset_id }}' }
          - id: mix_voice
            kind: assemble
            name: 'Mix voice over music · {{ lang }}'
            op: mux_audio
            inputs: ['{{ vars.audio }}', '{{ steps.source_bed.outputs.asset }}']
            params: { mode: under, gain_db: -12 }
            output_name: 'voiced_{{ lang }}.wav'
            outputs: { asset: '{{ result.asset_id }}' }
        else: []
      - id: voice_track
        kind: set
        values: { audio: '{{ steps.mix_voice.outputs.asset | default(vars.audio) }}' }
      - id: mux
        kind: assemble
        op: mux_audio
        inputs: ['{{ inputs.video }}', '{{ vars.audio }}']
        params: { mode: replace, fit: video }
        output_name: 'dubbed_{{ lang }}.mp4'
        outputs: { asset: '{{ result.asset_id }}' }
      - id: lip
        kind: branch
        when: '{{ inputs.lipsync }}'
        then:
          - id: lipsync_one
            kind: transform
            op: lipsync
            source: '{{ steps.mux.outputs.asset }}'
            outputs: { asset: '{{ result.assets[0] }}' }
        else: []
      - id: subs
        kind: set
        values: { video: '{{ steps.lipsync_one.outputs.asset | default(steps.mux.outputs.asset) }}' }
      - id: burn
        kind: assemble
        when: '{{ inputs.burn_subtitles }}'
        op: burn_captions
        inputs: ['{{ vars.video }}']
        params:
          {
            transcript: '{{ steps.transcribe.outputs.transcript }}',
            look: clean,
            max_words: 5,
            max_chars: 32,
            language: '{{ lang | slice(0, 2) }}',
          }
        output_name: 'final_{{ lang }}.mp4'
        outputs: { asset: '{{ result.asset_id }}' }
      - id: final_one
        kind: export
        files:
          - {
              ref: '{{ steps.burn.outputs.asset | default(vars.video) }}',
              name: 'final_{{ lang }}.mp4',
              tags: [deliverable, '{{ lang }}'],
            }

  - id: done
    kind: set
    values: { first: '{{ steps.dubs.outputs[0].video }}' }
outputs:
  final: '{{ vars.first }}'
