name: Provider request
description: Request support for a provider or model route
title: 'provider: '
labels: [provider]
body:
  - type: input
    id: provider
    attributes:
      label: Provider
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Official API documentation
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Capabilities and value
      description: List the capabilities, pricing source, retention policy, and why existing routes do not cover the need.
    validations:
      required: true
