name: Bug report
description: Report reproducible behavior that is not working
title: 'bug: '
labels: [bug]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Include the expected behavior, actual behavior, and minimal reproduction steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kilnry version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options: [npx launcher, Docker, development checkout]
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Never paste provider keys, MCP tokens, passwords, or unredacted logs.
