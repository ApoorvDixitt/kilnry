name: Feature request
description: Propose a focused improvement within Kilnry's local-first scope
title: 'feat: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What job is difficult today, and who has it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior rather than an implementation.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Scope check
      options:
        - label: This keeps media and keys local.
          required: true
        - label: This does not introduce a paywall or hosted Kilnry account.
          required: true
