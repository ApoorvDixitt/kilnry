name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
      - name: Enable pnpm
        run: corepack enable
      - name: Install pnpm
        run: corepack install --global pnpm@12.4.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache FFmpeg 7.0.2 static build
        id: ffmpeg-cache
        # The FFmpeg 7.0.2 binaries rarely change, so cache the two installed
        # files across runs; a hit skips the third-party download entirely.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/bin/ffmpeg
            /usr/local/bin/ffprobe
          key: ffmpeg-static-7.0.2-${{ runner.os }}
      - name: Install FFmpeg 7.0.2
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        # johnvansickle.com serves the version-pinned FFmpeg 7.0.2 amd64 static
        # build the doctor and media tests need; it is a third-party host that
        # occasionally times out on the read, which is what intermittently turned
        # an otherwise-green run red, so the download is wrapped in
        # nick-fields/retry (pinned by full commit SHA) and runs only on a cache
        # miss. The archive is checked against the MD5 the publisher published for
        # this build before anything is installed, so a corrupt or swapped file
        # fails the step instead of installing.
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 5
          retry_on: error
          command: |
            set -euo pipefail
            tmp="$(mktemp -d)"
            curl -fsSL --retry 3 --retry-delay 5 -o "$tmp/ffmpeg.tar.xz" \
              https://johnvansickle.com/ffmpeg/releases/ffmpeg-7.0.2-amd64-static.tar.xz
            # MD5 published by johnvansickle for the 7.0.2 amd64 static build,
            # verified against ffmpeg-release-amd64-static.tar.xz.md5 while 7.0.2
            # was the current release.
            echo "7fa72b652e19bf84c9461e332ea1cdf3  $tmp/ffmpeg.tar.xz" | md5sum -c -
            tar -xf "$tmp/ffmpeg.tar.xz" -C "$tmp"
            dir="$tmp/ffmpeg-7.0.2-amd64-static"
            sudo install -m755 "$dir/ffmpeg" /usr/local/bin/ffmpeg
            sudo install -m755 "$dir/ffprobe" /usr/local/bin/ffprobe
      - name: Verify FFmpeg 7.0.2
        run: |
          set -euo pipefail
          ffmpeg -version | head -n1
          ffprobe -version | head -n1
      - name: Check licence headers
        run: pnpm check:headers
      - name: Check provenance
        run: pnpm check:provenance
      - name: Check canon
        run: pnpm check:canon
      - name: Check message catalogue
        run: pnpm i18n:check
      - name: Check launcher package size
        run: pnpm check:size
      - name: Lint and format
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      # The committed third-party notices must equal what the lockfile generates,
      # so a dependency change cannot ship stale notices (F-SET-11).
      - name: Third-party notices are current
        run: pnpm check:notices
      # Runs after the typecheck because that is what builds the launcher the
      # command lives in; the launcher's binary loads its compiled entry point.
      - name: Validate the shipped workflow catalogue
        run: pnpm workflows:validate
      - name: Unit and integration tests
        run: pnpm test
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser component tests
        run: pnpm test:browser
      - name: Production build
        run: pnpm build
        env:
          # The production artefact must be built as a release: this makes the
          # runtime and the request proxy refuse to run with the test mock
          # service worker enabled (F-SET-08).
          KILNRY_RELEASE_BUILD: '1'
      - name: Production build smoke (standalone appVersion)
        # Start the built standalone server once and assert /api/health reports
        # the @kilnry/core version, proving appVersion() resolves through the
        # transpilePackages bundle (Group 5; every other run uses next dev).
        run: pnpm smoke:prod
      - name: Audit production dependencies
        run: pnpm audit --prod

  # The Playwright acceptance scenarios run as a matrix keyed by milestone tag
  # rather than as one step inside the job above. All of them on one runner grew
  # past that job's half-hour budget once the workflow runs started doing their
  # real work, and a single flake meant re-running every scenario together with
  # the lint, typecheck, unit, browser and build steps. Sharded, no shard comes
  # close to its own budget and a flake re-runs only its own scenarios. The m7
  # shard carries the M7 robustness scenarios (S-21 LAN access, S-22 recovery
  # kit) and the per-feature P2 checks. The M6 render suite outgrew one runner:
  # every workflow drives real ffmpeg end to end, the faceless stills run alone
  # takes 13–17 minutes on CI, and the twelve scenarios together with one retry
  # ran past the job cap (run 37182141267, 43.9 minutes). It is split three
  # ways by a second tag on each title so no shard runs past about 20 minutes
  # and a single retry cannot reach the cap: m6-faceless (the stills render on
  # its own), m6-video (the ugc-ad and subtitle renders) and m6-stills-gate (the
  # image workflows plus the @gate suites). The local gate "@smoke|@m6|@gate"
  # still matches every one of them. Each shard runs the first-run smoke
  # scenario before its own, because a fresh server rewrites the setup token and
  # a later scenario would otherwise be unauthenticated. @visual and @matrix stay
  # out: the visual baselines are platform-specific and regenerated locally, and
  # the client matrix needs clients installed on the build machine.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: m3-m4
            grep: '@m3|@m4'
          - name: m5
            grep: '@m5'
          - name: m6-faceless
            grep: '@m6-faceless'
          - name: m6-video
            grep: '@m6-video'
          - name: m6-stills-gate
            grep: '@m6-stills|@gate'
          - name: m7
            grep: '@m7'
    name: e2e (${{ matrix.shard.name }})
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
      - name: Enable pnpm
        run: corepack enable
      - name: Install pnpm
        run: corepack install --global pnpm@12.4.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache FFmpeg 7.0.2 static build
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/bin/ffmpeg
            /usr/local/bin/ffprobe
          key: ffmpeg-static-7.0.2-${{ runner.os }}
      - name: Install FFmpeg 7.0.2
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 5
          retry_on: error
          command: |
            set -euo pipefail
            tmp="$(mktemp -d)"
            curl -fsSL --retry 3 --retry-delay 5 -o "$tmp/ffmpeg.tar.xz" \
              https://johnvansickle.com/ffmpeg/releases/ffmpeg-7.0.2-amd64-static.tar.xz
            echo "7fa72b652e19bf84c9461e332ea1cdf3  $tmp/ffmpeg.tar.xz" | md5sum -c -
            tar -xf "$tmp/ffmpeg.tar.xz" -C "$tmp"
            dir="$tmp/ffmpeg-7.0.2-amd64-static"
            sudo install -m755 "$dir/ffmpeg" /usr/local/bin/ffmpeg
            sudo install -m755 "$dir/ffprobe" /usr/local/bin/ffprobe
      - name: Verify FFmpeg 7.0.2
        run: |
          set -euo pipefail
          ffmpeg -version | head -n1
          ffprobe -version | head -n1
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Acceptance shard ${{ matrix.shard.name }}
        run: pnpm e2e --grep "@smoke|${{ matrix.shard.grep }}"
      - name: Keep the shard's evidence
        if: ${{ !success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ matrix.shard.name }}
          path: |
            test-results/
            playwright-report/
            .dev/e2e-data/logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
