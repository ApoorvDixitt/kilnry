name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
      - name: Enable pnpm
        run: corepack enable
      - name: Install pnpm
        run: corepack install --global pnpm@12.4.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check licence headers
        run: pnpm check:headers
      - name: Check provenance
        run: pnpm check:provenance
      - name: Check canon
        run: pnpm check:canon
      - name: Check message catalogue
        run: pnpm i18n:check
      - name: Check launcher package size
        run: pnpm check:size
      - name: Lint and format
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser component tests
        run: pnpm test:browser
      - name: Smoke acceptance tests
        run: pnpm e2e --grep @smoke
      - name: Production build
        run: pnpm build
      - name: Audit production dependencies
        run: pnpm audit --prod
