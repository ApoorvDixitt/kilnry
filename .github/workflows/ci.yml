name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
      - name: Enable pnpm
        run: corepack enable
      - name: Install pnpm
        run: corepack install --global pnpm@12.4.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install FFmpeg 7
        # The release static build lives at johnvansickle.com, a third-party host
        # that occasionally times out; that read, not any GitHub rate limit, is
        # what intermittently failed the setup-ffmpeg action and turned an
        # otherwise-green run red. Wrapping the download in nick-fields/retry
        # (pinned by full commit SHA) retries the timeout up to three times and
        # installs the FFmpeg 7 static build the doctor and media tests need.
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 5
          retry_on: error
          command: |
            set -euo pipefail
            tmp="$(mktemp -d)"
            curl -fsSL --retry 3 --retry-delay 5 -o "$tmp/ffmpeg.tar.xz" \
              https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xf "$tmp/ffmpeg.tar.xz" -C "$tmp"
            dir="$(find "$tmp" -maxdepth 1 -type d -name 'ffmpeg-*-static' | head -n1)"
            sudo install -m755 "$dir/ffmpeg" /usr/local/bin/ffmpeg
            sudo install -m755 "$dir/ffprobe" /usr/local/bin/ffprobe
            ffmpeg -version | head -n1
      - name: Check licence headers
        run: pnpm check:headers
      - name: Check provenance
        run: pnpm check:provenance
      - name: Check canon
        run: pnpm check:canon
      - name: Check message catalogue
        run: pnpm i18n:check
      - name: Check launcher package size
        run: pnpm check:size
      - name: Lint and format
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser component tests
        run: pnpm test:browser
      - name: Smoke acceptance tests
        run: pnpm e2e --grep @smoke
      - name: Acceptance and gate suites
        run: pnpm e2e --grep "@m3|@m4|@m5|@gate"
      - name: Production build
        run: pnpm build
        env:
          # The production artefact must be built as a release: this makes the
          # runtime and the request proxy refuse to run with the test mock
          # service worker enabled (F-SET-08).
          KILNRY_RELEASE_BUILD: '1'
      - name: Audit production dependencies
        run: pnpm audit --prod
