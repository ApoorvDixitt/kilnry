packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  msw: false

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.1'
  - '@turbo/darwin-arm64@2.11.1'
  - '@turbo/linux-64@2.11.1'
  - '@turbo/linux-arm64@2.11.1'
  - '@turbo/windows-64@2.11.1'
  - '@turbo/windows-arm64@2.11.1'
  - prettier@3.9.8
  - turbo@2.11.1

onlyBuiltDependencies:
  - '@electric-sql/pglite'
  - '@napi-rs/keyring'
  - argon2
  - sharp

overrides:
  esbuild: 0.28.2
  react: 19.3.0
  react-dom: 19.3.0
  zod: 4.6.5
  # source-map-js < 1.2.2 is vulnerable to an event-loop denial of service
  # through indexed source-map section offsets (GHSA-68fv-2mgg-jv7q, high); it
  # reaches the tree only transitively through postcss under next and vitest.
  # The advisory was published after v0.5.1 shipped and turned `pnpm audit
  # --prod` red; the patched line is >=1.2.2.
  source-map-js: '>=1.2.2'
